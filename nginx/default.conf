upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # Must stay above the 2 MB avatar limit enforced by the application.
    client_max_body_size 5m;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        proxy_pass http://django;
        # $http_host keeps the port, which Stripe redirect URLs and the CSRF origin check rely on.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
