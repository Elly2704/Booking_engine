{% extends 'base.html' %}

{% block content %}
<h2>Delete Resource</h2>
<p>Are you sure you want to delete "{{ object.name }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Confirm</button>
    <a href="{% url 'resources:resource_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
