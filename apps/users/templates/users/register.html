{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% translate "Register" %}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2>{% translate "Register" %}</h2>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-success">{% translate "Register" %}</button>
        </form>
    </div>
</div>
{% endblock %}
